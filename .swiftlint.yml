# SwiftLint config. CI runs `swiftlint --strict`, so every violation (warnings
# included) fails the build.
#
# US-SDK-IOS-LINT-DEBT-001 (2026-07-24): the 9 rules that were temporarily
# disabled to suppress 192 pre-existing violations have all been RE-ENABLED by
# fixing the underlying code. `disabled_rules` is now empty and the SDK passes
# `swiftlint --strict` with 0 violations across Sources + Tests.
#
# Three internal/public result structs keep a 2-char `ok` flag (idiomatic and,
# for AdfiniaPushRegistrationResult, part of the public API); each is handled
# with a local `// swiftlint:disable:next identifier_name` plus a comment, so
# the identifier_name rule stays globally enforced. Do not add new violations.
disabled_rules: []
excluded:
  - .build
