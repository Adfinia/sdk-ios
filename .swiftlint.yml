# SwiftLint config. CI runs `swiftlint --strict`, so any violation (including
# warnings) fails the build. Idiomatic short locals (ok, p, r, q, i, s1) appear
# in both Sources/ (Transport.swift) and Tests/ and trip the default
# identifier_name min-length rule (3). Relax ONLY the min-length sub-rule so
# short local names pass; every other rule (and identifier_name's other checks)
# stays strict. Added 2026-07-22 to fix the CI SwiftLint job.
identifier_name:
  min_length:
    warning: 1
    error: 1
excluded:
  - .build
