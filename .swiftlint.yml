# SwiftLint config. CI runs `swiftlint --strict`, so every violation (warnings
# included) fails the build. This SDK predates the strict CI and carries 31
# PRE-EXISTING violations across the 9 rules below (Sources + Tests) - it has
# never passed --strict; the 2026-07-22 main push was the first to run it.
#
# To unblock CI now, exactly those 9 currently-violated rules are disabled.
# This is DEBT SUPPRESSION, not a fix: US-SDK-IOS-LINT-DEBT-001 tracks fixing
# the violations and re-enabling each rule. Every OTHER SwiftLint rule stays
# enforced under --strict, so do not introduce new violations elsewhere.
disabled_rules:
  - identifier_name              # 12: short locals (ok/p/r) + leading-underscore test helpers
  - line_length                  # 7
  - implicit_optional_initialization  # 5
  - static_over_final_class      # 2
  - trailing_comma               # 1
  - statement_position           # 1
  - redundant_discardable_let    # 1
  - force_try                    # 1 (test)
  - cyclomatic_complexity        # 1
excluded:
  - .build
